services:
  naxus:
    image: ${NAXUS_IMAGE:-nasaruntime/naxus:1.0.0}
    container_name: naxus
    restart: unless-stopped
    ports:
      - "127.0.0.1:7443:7443"
    environment:
      NAXUS_PUBLIC_URL: ${NAXUS_PUBLIC_URL:-http://127.0.0.1:7443}
      NAXUS_AUTH_MODE: managed
    volumes:
      - naxus-data:/var/lib/naxus
      - naxus-logs:/usr/local/logs/naxus
    stop_grace_period: 75s
    init: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  naxus-data:
  naxus-logs:
