[package]
name = "naxus-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo repository service with same-version revisions, public registry caching and Admin"
keywords = ["cargo", "registry", "server", "artifacts", "proxy"]
categories = ["development-tools", "web-programming::http-server"]
readme = "README.md"
publish = true
autotests = false
include = ["/Cargo.toml", "/README.md", "/LICENSE-*", "/src/**"]

