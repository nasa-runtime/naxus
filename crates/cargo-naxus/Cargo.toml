[package]
name = "cargo-naxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo client for same-version Naxus revisions, atomic publishing and locked snapshot builds"
readme = "README.md"
publish = false
autotests = false
include = ["/Cargo.toml", "/README.md", "/LICENSE-*", "/src/**"]

[dependencies]
anyhow.workspace = true
naxus-client = { version = "0.1.0", path = "../naxus-client" }
naxus-core = { version = "0.1.0", path = "../naxus-core" }
naxus-registry = { version = "0.1.0", path = "../naxus-registry" }
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
